<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="google-site-verification" content="cUUhLKqcymaygegRPUCCzzeEsIR298KBVpsc5M5sMTw" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPG</title>
<style>
  html, body { height: 100%; margin: 0; background: #0d1117; color: #c9d1d9; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 1800; margin: 0 auto; padding: 8px; box-sizing: border-box; }
  #out { flex: 1; overflow-y: auto; white-space: pre-wrap; word-break: break-word; background: #010409; border: 1px solid #30363d; border-radius: 6px; padding: 10px; }
  #bar { display: flex; gap: 6px; margin-top: 8px; }
  #in { flex: 1; background: #010409; color: inherit; border: 1px solid #30363d; border-radius: 6px; padding: 8px; font: inherit; }
  button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
  button.alt { background: #30363d; }
  #status { font-size: 12px; margin-top: 4px; color: #8b949e; }

  /* ===== COULEURS PAR TYPE DE LIGNE (modifie les codes #... ici) ===== */
  .ln { min-height: 1.2em; }
  .c-attack   { color: #f85149; }                       /* ton attaque             : rouge        */
  .c-enemyatk { color: #ff9e64; }                       /* l'ennemi te frappe      : orange       */
  .c-warn     { color: #ff79c6; font-weight: bold; }    /* attaque puissante       : rose, gras   */
  .c-miss     { color: #6e7681; }                       /* attaque / fuite ratée   : gris foncé   */
  .c-block    { color: #a5d6ff; }                       /* blocage                 : bleu clair   */
  .c-heal     { color: #3fb950; }                       /* fuite réussie, soins    : vert         */
  .c-win      { color: #e3b341; font-weight: bold; }    /* victoire, niveau sup.   : jaune, gras  */
  .c-lose     { color: #fff; background: #da3633; }     /* défaite                 : fond rouge   */
  .c-enemy    { color: #d29922; }                       /* infos de l'ennemi       : or sombre    */
  .c-info     { color: #bc8cff; }                       /* tes stats, ton tour     : violet       */
  .c-menu     { color: #39c5cf; }                       /* menus et choix          : cyan         */
  .c-prompt   { color: #8b949e; }                       /* "Ton choix:", pseudo    : gris         */
  .c-narr     { color: #9aa7b8; font-style: italic; }   /* histoire, dialogues     : gris italique*/
  .c-err      { color: #ff7b72; font-weight: bold; }    /* erreurs                 : rouge vif    */
  .c-cmd      { color: #fff; font-weight: bold; }       /* ce que tu tapes         : blanc, gras  */
</style>
</head>
<body>
<div id="app">
  <div id="out"></div>
  <div id="bar">
    <input id="in" autocomplete="off" autofocus placeholder="Tape une commande puis Entrée">
    <button id="send">Envoyer</button>
    <button id="restart" class="alt">Redémarrer</button>
  </div>
  <div id="status">Connexion…</div>
</div>
<script>
  // Chemins relatifs pour les appels API (ex. 'api/output').
  const out = document.getElementById('out');
  const input = document.getElementById('in');
  const statusEl = document.getElementById('status');
  let next = 0;

  // ===== RÈGLES : la première qui correspond gagne (l'ORDRE COMPTE) =====
  // [expression régulière, classe CSS]. Les mots viennent de ton lang/fr.json.
  // Les lignes qui ne correspondent à aucune règle gardent la couleur normale.
  const rules = [
    // Erreurs
    [/\[ERREUR\]|entre un nombre|erreur|error/i,                   'c-err'],
    // Questions posées au joueur ("Ton choix:", pseudo)
    [/^\s*ton choix|quel est ton pseudo/i,                         'c-prompt'],
    // Menus (doivent passer AVANT les règles "attaque", "potion", etc.)
    [/\d\s*=|tu as (deux|trois|quatre) (options|choix)|veut tu recommencer/i, 'c-menu'],
    // Fin de combat
    [/tu as perdu/i,                                               'c-lose'],
    [/est mort|tu as gagn|mont. de niveau/i,                       'c-win'],
    // Combat
    [/attaque puissante/i,                                         'c-warn'],
    [/pas reussi/i,                                                'c-miss'],
    [/te frappe/i,                                                 'c-enemyatk'],
    [/\btu frappe\b/i,                                             'c-attack'],
    [/bloquer/i,                                                   'c-block'],
    [/enfuir|regagne de la vie/i,                                  'c-heal'],
    // Infos
    [/est devant toi|pv et fait/i,                                 'c-enemy'],
    [/^\s*bienvenue|c'est ton tour/i,                              'c-info'],
    // Histoire et dialogues
    [/^\s*(voix|femme|homme|infirmi)|tu ouvre les yeux/i,          'c-narr'],
    // Messages système entre crochets
    [/^\s*\[.*\]\s*$|arrêté/i,                                     'c-sys'],
  ];

  function classify(text) {
    for (const [re, cls] of rules) if (re.test(text)) return cls;
    return '';
  }

  // Retire les codes ANSI (couleurs, curseur) qui s'afficheraient en texte brut.
  const stripAnsi = s => s.replace(/\x1b\[[0-9;?]*[A-Za-z]/g, '');

  // La dernière ligne (incomplète, par ex. une question sans retour à la ligne)
  // vit dans "live" ; les lignes terminées sont insérées avant.
  const live = document.createElement('div');
  live.className = 'ln';
  out.appendChild(live);
  let pending = '';

  function addLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'ln ' + (cls ?? classify(text));
    div.textContent = text;
    out.insertBefore(div, live);
  }

  function updateLive() {
    live.textContent = pending;
    live.className = 'ln ' + classify(pending);
  }

  function pushText(text) {
    pending += text.replace(/\r/g, '');
    const parts = pending.split('\n');
    pending = parts.pop(); // dernier morceau : ligne pas encore terminée
    for (const p of parts) addLine(p);
    updateLive();
  }

  function clearOut() {
    out.replaceChildren(live);
    pending = '';
    updateLive();
  }

  async function poll() {
    try {
      const r = await fetch('api/output?since=' + next, { cache: 'no-store' });
      const d = await r.json();
      if (d.next < next) clearOut(); // redémarrage
      next = d.next;
      if (d.chunks.length) {
        const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
        pushText(stripAnsi(d.chunks.join('')));
        if (atBottom) out.scrollTop = out.scrollHeight;
      }
      statusEl.textContent = d.running ? 'Jeu en cours' : 'Jeu arrêté';
    } catch {
      statusEl.textContent = 'Serveur injoignable…';
    }
    setTimeout(poll, 400);
  }

  async function send() {
    const cmd = input.value;
    input.value = '';
    // Si une question attend sur la ligne en cours, la réponse s'y colle ; sinon "> commande".
    addLine(pending ? pending + cmd : '> ' + cmd, 'c-cmd');
    pending = '';
    updateLive();
    out.scrollTop = out.scrollHeight;
    try {
      const r = await fetch('api/input', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      });
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        addLine('[' + (e.error || 'Erreur') + ']', 'c-err');
      }
    } catch {
      addLine('[Envoi impossible]', 'c-err');
    }
    input.focus();
  }

  document.getElementById('send').onclick = send;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  document.getElementById('restart').onclick = async () => {
    await fetch('api/restart', { method: 'POST' });
    clearOut();
    next = 0;
  };

  poll();
</script>
</body>
</html>
